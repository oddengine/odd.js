<body>
    <header class="demo-toolbar">
        <div class="demo-brand">
            <strong>odd.js App</strong>
            <span id="identity">聊天 · 观看 · 会议 · 游戏</span>
        </div>
        <div class="demo-actions">
            <span id="status" role="status">正在初始化…</span>
            <button id="retry" type="button">重新连接</button>
        </div>
    </header>
    <details class="demo-options">
        <summary>演示连接设置</summary>
        <div class="demo-options-content">
            <form id="play" class="demo-form">
                <label>播放示例<select id="source"></select></label>
                <label class="demo-address">播放地址<input id="address" type="text" placeholder="HTTP / HTTPS 媒体地址" required></label>
                <label>播放模块<select id="type"><option>SRC</option><option>FLV</option><option>FMP4</option><option>RTC</option></select></label>
                <label class="demo-checkbox"><input id="vod" type="checkbox">点播</label>
                <button type="submit">打开媒体</button>
            </form>
            <form id="subscribe" class="demo-form">
                <label class="demo-address">会议流 ID<input id="remote" type="text" placeholder="从另一页面的发布信息复制" required></label>
                <button type="submit">订阅会议流</button>
            </form>
            <p>HLS 使用原生 SRC，受浏览器支持范围限制。直播源和游戏 ROM 需由服务器提供。</p>
        </div>
    </details>
    <div id="streams" class="demo-streams" aria-live="polite"></div>
    <p id="hint" class="demo-hint">连接成功后，选择左侧的聊天、观看、会议或游戏入口。</p>
    <p id="notice" class="demo-notice" role="alert"></p>
    <main class="demo-main">
        <div id="app" class="demo-app" aria-busy="true"></div>
    </main>
    <noscript>需要启用 JavaScript 才能使用此演示。</noscript>
